<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futures Average Calculator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e2e5ea;--ac:#2962ff;--g:#0a8f6a;--r:#d92d3f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1013;--card:#171a20;--tx:#e8eaee;--mut:#8b93a1;--bd:#2a2f38;--ac:#5b8cff;--g:#2ecf9f;--r:#ff6674}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1013;--card:#171a20;--tx:#e8eaee;--mut:#8b93a1;--bd:#2a2f38;--ac:#5b8cff;--g:#2ecf9f;--r:#ff6674}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:19px;margin:4px 0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:10px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:14px;font-weight:600}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.x{flex:0 0 38px;padding:10px 0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:10px}
.stat b{display:block;font-size:18px;margin-top:2px}
.g{color:var(--g)}.r{color:var(--r)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.warn{color:var(--r);font-size:14px;margin-top:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
</style>
</head>
<body>
<h1>Futures Average Calculator</h1>

<div class="card">
  <h2>Setup</h2>
  <div class="row">
    <div><label>Symbol</label><input id="sym" value="HDFCBANK" autocapitalize="characters"></div>
    <div><label>Lot size (qty)</label><input id="lot" type="number" inputmode="decimal" value="700"></div>
    <div><label>Side</label><select id="side"><option value="S" selected>Sell (Short)</option><option value="L">Buy (Long)</option></select></div>
  </div>
  <div class="note">Lot size changes from time to time. Check the current one on NSE and edit it above.</div>
</div>

<div class="card">
  <h2>Your trades</h2>
  <div id="trades"></div>
  <button class="ghost" id="add">+ Add trade</button>
  <div class="big" style="margin-top:12px" id="sum"></div>
</div>

<div class="card">
  <h2>Plan next entry</h2>
  <div class="row">
    <div><label>Next entry price</label><input id="np" type="number" inputmode="decimal" placeholder="e.g. 1900"></div>
    <div><label>Target new average</label><input id="ta" type="number" inputmode="decimal" placeholder="e.g. 1950"></div>
  </div>
  <div id="plan"></div>
</div>

<div class="card">
  <h2>If I add lots at the next price</h2>
  <div id="tbl" class="scroll"></div>
</div>

<div class="card">
  <h2>Exit points</h2>
  <div class="row">
    <div><label>Profit target (points above/below avg)</label><input id="pp" type="number" inputmode="decimal" placeholder="e.g. 20"></div>
  </div>
  <div id="exit"></div>
  <div class="note">Points only. Brokerage, taxes and charges are not included, so keep a small buffer above breakeven.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const f=(n,d=2)=>isFinite(n)?n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
let trades=[{p:'',l:1}];

function renderTrades(){
  $('trades').innerHTML=trades.map((t,i)=>`
    <div class="row">
      <div><label>Trade ${i+1} price</label><input type="number" inputmode="decimal" data-i="${i}" data-k="p" value="${t.p}"></div>
      <div><label>Lots</label><input type="number" inputmode="decimal" data-i="${i}" data-k="l" value="${t.l}"></div>
      ${trades.length>1?`<button class="ghost x" data-del="${i}" style="margin-top:17px">✕</button>`:''}
    </div>`).join('');
}

function state(){
  const lot=+$('lot').value||0, long=$('side').value==='L';
  let Q=0,C=0;
  trades.forEach(t=>{const p=+t.p,q=(+t.l)*lot;if(p>0&&q>0){Q+=q;C+=p*q;}});
  return {lot,long,Q,A:Q?C/Q:NaN};
}

function calc(){
  const {lot,long,Q,A}=state();
  const lots=lot?Q/lot:0;
  $('sum').innerHTML=`
    <div class="stat">Average price<b>${f(A)}</b></div>
    <div class="stat">Total lots / qty<b>${f(lots,0)} / ${f(Q,0)}</b></div>`;

  // Plan: lots needed for target average
  const P=+$('np').value, T=+$('ta').value;
  let html='';
  if(Q&&P>0&&T>0){
    const ok=(T-A)*(T-P)<0;
    if(!ok){
      html=`<div class="warn">Target average must be between your current average (${f(A)}) and your next entry price (${f(P)}), so between ${f(Math.min(A,P))} and ${f(Math.max(A,P))}. An average can only land between those two prices.</div>`;
    }else{
      const q=Q*(A-T)/(T-P), n=Math.ceil(q/lot-1e-9);
      const nq=n*lot, newA=(Q*A+nq*P)/(Q+nq);
      html=`<div class="big">
        <div class="stat">Lots to add<b>${n}</b><span class="note">exact: ${f(q/lot)}</span></div>
        <div class="stat">New average<b class="g">${f(newA)}</b></div>
        <div class="stat">Total lots after<b>${f((Q+nq)/lot,0)}</b></div>
        <div class="stat">Added qty<b>${f(nq,0)}</b></div></div>
        <div class="note">Lots are rounded up, so the new average lands at or just past your target.</div>`;
    }
  }else html='<div class="note">Enter the next entry price and a target average to see how many lots you need.</div>';
  $('plan').innerHTML=html;

  // Table of lots vs new average at next price
  if(Q&&P>0){
    let rows='';
    for(let n=1;n<=10;n++){
      const nq=n*lot,na=(Q*A+nq*P)/(Q+nq);
      rows+=`<tr><td>+${n}</td><td>${f((Q+nq)/lot,0)}</td><td>${f(na)}</td><td>${f(Math.abs(na-A))}</td></tr>`;
    }
    $('tbl').innerHTML=`<table><tr><th>Add lots</th><th>Total lots</th><th>New avg</th><th>Avg moves</th></tr>${rows}</table>`;
  }else $('tbl').innerHTML='<div class="note">Enter a next entry price above.</div>';

  // Exit points
  const pp=+$('pp').value;
  let ex='';
  if(Q){
    const dir=long?1:-1;
    ex=`<div class="big"><div class="stat">Breakeven exit<b>${f(A)}</b></div>`;
    if(pp>0){
      const tgt=A+dir*pp;
      ex+=`<div class="stat">Target exit<b class="g">${f(tgt)}</b><span class="note">P&amp;L ₹${f(pp*Q,0)}</span></div>`;
    }
    ex+='</div>';
  }
  $('exit').innerHTML=ex;
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.i!==undefined){trades[+t.dataset.i][t.dataset.k]=t.value;}
  calc();
});
document.addEventListener('click',e=>{
  if(e.target.id==='add'){trades.push({p:'',l:1});renderTrades();calc();}
  if(e.target.dataset&&e.target.dataset.del!==undefined){trades.splice(+e.target.dataset.del,1);renderTrades();calc();}
});
renderTrades();calc();
</script>
</body>
</html>
